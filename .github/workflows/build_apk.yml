name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: studenttrack-pro-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: "📱 Mobile App Build #${{ github.run_number }}"
          body: |
            ## 📱 StudentTrack Pro Mobile — Android APK

            ### What's included
            - ✅ Task Management with priority & swipe gestures
            - 🔁 Habit Tracking with streak system
            - 🍅 Pomodoro Focus Timer
            - ⏰ Exam Countdown
            - 🎯 Goals & Milestones (view + check-off)
            - 📝 Quick Notes
            - ❤️ Health Dashboard (Sleep / Water / Mood / Exercise)
            - 📊 Attendance Tracker
            - 📈 Stats & Analytics
            - 🏅 23 Badge System + XP Levels
            - ⚙️ Settings & Notifications

            ### Installation
            1. Download the `app-arm64-v8a-release.apk` (for most modern phones)
            2. Enable "Install from unknown sources" in Android settings
            3. Install and enjoy!

            > Built automatically from `mobile/` on push to main.
          files: mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
