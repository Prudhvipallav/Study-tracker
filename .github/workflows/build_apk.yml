name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate launcher icons (PNG for all densities)
        working-directory: mobile
        run: |
          pip install Pillow --quiet
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw

          sizes = {
              'mipmap-mdpi':    48,
              'mipmap-hdpi':    72,
              'mipmap-xhdpi':   96,
              'mipmap-xxhdpi':  144,
              'mipmap-xxxhdpi': 192,
          }
          base = 'android/app/src/main/res'
          for folder, size in sizes.items():
              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)
              img = Image.new('RGBA', (size, size), (30, 144, 255, 255))
              draw = ImageDraw.Draw(img)
              m = size // 6
              draw.ellipse([m, m, size - m, size - m], fill=(255, 255, 255, 255))
              img.save(os.path.join(path, 'ic_launcher.png'))
              img.save(os.path.join(path, 'ic_launcher_round.png'))
          print('Launcher icons generated for all densities.')
          EOF

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: studenttrack-pro-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: "📱 Mobile App Build #${{ github.run_number }}"
          body: |
            ## 📱 StudentTrack Pro Mobile — Android APK

            ### Installation
            1. Download `app-arm64-v8a-release.apk` (most modern phones)
            2. Enable "Install from unknown sources" in Android settings
            3. Install and enjoy!

            Built from commit `${{ github.sha }}`
          files: mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
