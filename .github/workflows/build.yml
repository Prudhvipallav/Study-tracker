name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller installer/build.spec --noconfirm

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS Installer
        run: makensis installer/installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentTrackPro-Windows-Installer
          path: StudentTrackPro_Setup.exe
          retention-days: 30

      - name: Create GitHub Release (on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "StudentTrack Pro v1.0.${{ github.run_number }}"
          files: StudentTrackPro_Setup.exe
          body: |
            🎓 **StudentTrack Pro — Automated Windows Build**
            
            - Built from commit ${{ github.sha }}
            - Download `StudentTrackPro_Setup.exe` and run as administrator
            - No Python installation required
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
