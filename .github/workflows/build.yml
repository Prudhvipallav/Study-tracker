name: Build Windows Installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (direct CLI, no spec file)
        run: |
          pyinstaller main.py `
            --onefile `
            --name StudentTrackPro `
            --noconsole `
            --noconfirm `
            "--icon=assets/icon.ico" `
            "--add-data=assets;assets" `
            "--add-data=modules;modules" `
            "--add-data=database;database" `
            --hidden-import=customtkinter `
            --hidden-import=PIL `
            --hidden-import=PIL._imagingtk `
            --hidden-import=matplotlib `
            --hidden-import=matplotlib.backends.backend_tkagg `
            --hidden-import=sqlite3 `
            --hidden-import=plyer.platforms.win.notification
          Write-Host "=== PyInstaller dist output ==="
          if (Test-Path "dist") { Get-ChildItem dist } else { Write-Host "ERROR: dist/ not created" }

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS Installer
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }
          Write-Host "Using: $makensis"
          & $makensis installer/installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentTrackPro-Windows-Installer
          path: installer/StudentTrackPro_Setup.exe
          retention-days: 30

      - name: Create GitHub Release (on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13
          name: "🖥️ StudentTrack Pro Desktop v13"
          files: installer/StudentTrackPro_Setup.exe
          body: |
            ## 🎓 StudentTrack Pro — Windows Desktop Installer
            1. Download `StudentTrackPro_Setup.exe`
            2. Run as Administrator
            3. No Python needed — everything is bundled!

            Built from `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
