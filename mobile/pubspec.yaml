name: studenttrack_pro
description: A student productivity companion app — track tasks, habits, goals, Pomodoro, health, and more. 100% offline.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.2
  flutter_local_notifications: ^17.1.2
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.0
  lottie: ^3.1.0
  provider: ^6.1.1
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quotes.json
    - assets/themes/engineering.json
    - assets/themes/medical.json
    - assets/themes/law.json
    - assets/themes/competitive.json

flutter_icons:
  android: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
